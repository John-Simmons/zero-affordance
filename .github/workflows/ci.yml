name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Formatting drifted unnoticed for weeks without this, so any wide
      # `prettier --write` kept dragging unrelated files into feature diffs.
      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # No Supabase secrets needed: the app falls back to the mock provider
      # when VITE_SUPABASE_* are absent (see src/lib/env.ts), so CI is hermetic.
      - name: Build
        run: pnpm build
